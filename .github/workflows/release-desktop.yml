name: Release desktop app

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    name: Package ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            name: windows-x64
            runner: ubuntu-latest
          - rid: linux-x64
            name: linux-x64
            runner: ubuntu-latest
          - rid: osx-x64
            name: macos-x64
            runner: macos-latest
          - rid: osx-arm64
            name: macos-arm64
            runner: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish self-contained app
        run: >-
          dotnet publish MiniMaxFlow/MiniMaxFlow.csproj
          --configuration Release
          --runtime ${{ matrix.rid }}
          --self-contained true
          --output publish/${{ matrix.name }}
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=None
          -p:DebugSymbols=false

      - name: Create macOS app archive
        if: runner.os == 'macOS'
        shell: bash
        env:
          PACKAGE: ${{ matrix.name }}
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/MiniMaxFlow.app"
          mkdir -p "$app/Contents/Resources" dist
          ditto "publish/$PACKAGE" "$app/Contents/MacOS"
          cp MiniMaxFlow/Assets/icon.icns "$app/Contents/Resources/MiniMaxFlow.icns"
          plist="$app/Contents/Info.plist"
          cp MiniMaxFlow/Info.plist "$plist"
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            version="${GITHUB_REF_NAME#v}"
            plutil -replace CFBundleShortVersionString -string "$version" "$plist"
            plutil -replace CFBundleVersion -string "$version" "$plist"
          fi
          plutil -lint "$plist"
          codesign --force --sign - "$app"
          archive="dist/MiniMaxFlow-$PACKAGE.zip"
          ditto -c -k --norsrc --keepParent "$app" "$archive"
          unpacked="$RUNNER_TEMP/verify/MiniMaxFlow.app"
          ditto -x -k "$archive" "$RUNNER_TEMP/verify"
          test -x "$unpacked/Contents/MacOS/MiniMaxFlow"
          codesign --verify --strict --deep "$unpacked"

      - name: Create Windows or Linux archive
        if: runner.os != 'macOS'
        shell: bash
        run: |
          mkdir -p dist
          (cd publish/${{ matrix.name }} && zip -r "../../dist/MiniMaxFlow-${{ matrix.name }}.zip" .)

      - uses: actions/upload-artifact@v4
        with:
          name: MiniMaxFlow-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: package
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create release and upload packages
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release delete "$TAG" --yes
          fi
          gh release create "$TAG" release-assets/* \
            --title "$TAG" \
            --generate-notes
